version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chimera_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chimera_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chimera_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-chimera_soc}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chimera_admin} -d ${POSTGRES_DB:-chimera_soc}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
